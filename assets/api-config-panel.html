<div class="am2-ac">
    <header class="am2-ac-top">
        <button id="amily2_back_to_main_from_api_config" class="am2-ac-iconbtn" type="button" title="返回">
            <i class="fas fa-arrow-left"></i>
        </button>
        <div class="am2-ac-top-text">
            <div class="am2-ac-title-row">
                <h2 class="am2-ac-title">API 连接</h2>
                <button id="amily2_open_api_config_tutorial" class="menu_button small_button secondary interactable am2-panel-tutorial-btn" type="button" title="小白教程：连接类型与功能分配">
                    <i class="fas fa-book-open"></i> 教程
                </button>
            </div>
            <p class="am2-ac-sub">管理模型接口，并分配给各功能</p>
        </div>
    </header>

    <nav class="am2-ac-tabs" role="tablist">
        <button type="button" class="am2-ac-tab is-active" data-ac-tab="connections" role="tab" aria-selected="true">连接</button>
        <button type="button" class="am2-ac-tab" data-ac-tab="routing" role="tab" aria-selected="false">分配</button>
        <button type="button" class="am2-ac-tab" data-ac-tab="more" role="tab" aria-selected="false">更多</button>
    </nav>

    <!-- ── 连接 ── -->
    <section class="am2-ac-view is-active" data-ac-view="connections" role="tabpanel">
        <div class="am2-ac-list-pane" id="amily2_profile_list_pane">
            <div class="am2-ac-toolbar">
                <div class="am2-ac-filters" role="tablist" aria-label="类型">
                    <button type="button" class="am2-ac-pill amily2_profile_type_filter active" data-type="all">全部</button>
                    <button type="button" class="am2-ac-pill amily2_profile_type_filter" data-type="chat">对话</button>
                    <button type="button" class="am2-ac-pill amily2_profile_type_filter" data-type="embedding">向量</button>
                    <button type="button" class="am2-ac-pill amily2_profile_type_filter" data-type="rerank">重排</button>
                </div>
                <button id="amily2_add_profile" class="am2-ac-primary" type="button">
                    <i class="fas fa-plus"></i> 添加
                </button>
            </div>
            <div id="amily2_profile_list" class="am2-ac-list"></div>
        </div>

        <!-- 编辑/新建：从列表切到表单，化整为零 -->
        <div class="am2-ac-form-pane" id="amily2_profile_form_details" hidden>
            <div class="am2-ac-form-bar">
                <button id="amily2_profile_modal_cancel" class="am2-ac-iconbtn" type="button" title="返回列表">
                    <i class="fas fa-arrow-left"></i>
                </button>
                <div class="am2-ac-form-bar-text">
                    <i id="amily2_profile_form_icon" class="fas fa-plus" hidden></i>
                    <strong id="amily2_profile_modal_title">添加连接</strong>
                </div>
                <button id="amily2_profile_modal_save" class="am2-ac-primary" type="button">保存</button>
            </div>

            <div class="am2-ac-form">
                <div class="am2-ac-field">
                    <label for="amily2_pf_name">名称</label>
                    <input id="amily2_pf_name" type="text" class="text_pole am2-ac-input" placeholder="例如：DeepSeek 主用" />
                </div>

                <div class="am2-ac-field-row">
                    <div class="am2-ac-field">
                        <label for="amily2_pf_type">用途</label>
                        <select id="amily2_pf_type" class="text_pole am2-ac-input">
                            <option value="chat">对话</option>
                            <option value="embedding">向量</option>
                            <option value="rerank">重排</option>
                        </select>
                    </div>
                    <div class="am2-ac-field">
                        <label for="amily2_pf_provider">厂商</label>
                        <select id="amily2_pf_provider" class="text_pole am2-ac-input">
                            <optgroup label="常用">
                                <option value="openai">OpenAI</option>
                                <option value="anthropic">Anthropic</option>
                                <option value="google">Google</option>
                                <option value="openrouter">OpenRouter</option>
                                <option value="deepseek">DeepSeek</option>
                                <option value="xai">xAI</option>
                            </optgroup>
                            <optgroup label="其它">
                                <option value="custom_oai">自定义兼容</option>
                                <option value="sillytavern_backend">ST 后端代理</option>
                                <option value="sillytavern_preset">ST 预设转发</option>
                            </optgroup>
                        </select>
                    </div>
                </div>

                <div class="am2-ac-field" id="amily2_pf_url_row">
                    <label for="amily2_pf_url">地址</label>
                    <input id="amily2_pf_url" type="text" class="text_pole am2-ac-input" placeholder="https://api.example.com/v1" />
                </div>

                <div id="amily2_pf_vendor_note" class="am2-ac-note" style="display:none;">
                    <i class="fas fa-info-circle"></i>
                    <span id="amily2_pf_vendor_note_text"></span>
                    <span id="amily2_pf_vendor_note_link_wrap" style="display:none;">
                        <a id="amily2_pf_vendor_note_link" href="#" target="_blank" rel="noopener"></a>
                    </span>
                </div>

                <div class="am2-ac-field">
                    <label for="amily2_pf_key">密钥 <span class="am2-ac-hint">加密保存 · 留空不改</span></label>
                    <input id="amily2_pf_key" type="password" class="text_pole am2-ac-input" placeholder="sk-…" autocomplete="off" />
                </div>

                <div class="am2-ac-field">
                    <label for="amily2_pf_model">模型</label>
                    <div class="am2-ac-combo">
                        <input id="amily2_pf_model" type="text" class="text_pole am2-ac-input" placeholder="模型名" />
                        <select id="amily2_pf_model_select" class="text_pole am2-ac-input" style="display:none;"></select>
                        <button id="amily2_pf_fetch_models" class="am2-ac-ghost amily2-vbtn" type="button" title="拉取模型列表">
                            <span class="vbtn-icon"><i class="fas fa-sync-alt"></i></span><span class="vbtn-label">拉取</span>
                        </button>
                    </div>
                </div>

                <div class="am2-ac-testline">
                    <button id="amily2_pf_test_conn" class="am2-ac-ghost amily2-vbtn" type="button">
                        <span class="vbtn-icon"><i class="fas fa-bolt"></i></span><span class="vbtn-label">测试</span>
                    </button>
                    <span id="amily2_pf_test_result" class="am2-ac-test-result"></span>
                </div>

                <details class="am2-ac-more amily2_advanced_section">
                    <summary>通用限制</summary>
                    <div class="am2-ac-more-body am2-advanced-body">
                        <div class="am2-ac-field">
                            <label for="amily2_pf_rpm">每分钟请求数（RPM）</label>
                            <input id="amily2_pf_rpm" type="number" class="text_pole am2-ac-input" min="0" step="1" value="0" inputmode="numeric" />
                            <small class="notes">限制该连接每分钟发出的模型请求；重试、向量分批与重排分别计数。设为 0 表示不限制。</small>
                        </div>
                    </div>
                </details>

                <div id="amily2_pf_chat_params">
                    <details class="am2-ac-more amily2_advanced_section">
                        <summary>高级</summary>
                        <div class="am2-ac-more-body am2-advanced-body">
                            <div class="am2-ac-field-row">
                                <div class="am2-ac-field">
                                    <label for="amily2_pf_max_tokens">最大输出</label>
                                    <input id="amily2_pf_max_tokens" type="number" class="text_pole am2-ac-input" min="100" max="200000" value="65500" />
                                </div>
                                <div class="am2-ac-field">
                                    <label for="amily2_pf_temperature">温度</label>
                                    <input id="amily2_pf_temperature" type="number" class="text_pole am2-ac-input" min="0" max="2" step="0.1" value="1.0" />
                                </div>
                            </div>
                            <label class="am2-ac-check">
                                <input id="amily2_pf_fake_stream" type="checkbox" />
                                <span>
                                    <strong>防超时</strong>
                                    <small>流式收完再拼，适合慢代理</small>
                                </span>
                            </label>
                            <div class="am2-ac-field">
                                <label for="amily2_pf_custom_params">自定义 JSON</label>
                                <textarea id="amily2_pf_custom_params" class="text_pole am2-ac-input am2-ac-code" rows="4" spellcheck="false" placeholder='{"top_p": 0.9}'></textarea>
                                <small id="amily2_pf_custom_params_hint" class="am2-ac-hint-line notes"></small>
                                <small id="amily2_pf_custom_params_error" class="am2-ac-error-line notes" style="display:none;"></small>
                            </div>
                        </div>
                    </details>
                </div>

                <div id="amily2_pf_embedding_params" style="display:none;">
                    <details class="am2-ac-more amily2_advanced_section">
                        <summary>高级</summary>
                        <div class="am2-ac-more-body am2-advanced-body">
                            <div class="am2-ac-field-row">
                                <div class="am2-ac-field">
                                    <label for="amily2_pf_dimensions">维度 <span class="am2-ac-hint">可空</span></label>
                                    <input id="amily2_pf_dimensions" type="number" class="text_pole am2-ac-input" min="1" placeholder="1536" />
                                </div>
                                <div class="am2-ac-field">
                                    <label for="amily2_pf_encoding_format">编码</label>
                                    <select id="amily2_pf_encoding_format" class="text_pole am2-ac-input">
                                        <option value="float">float</option>
                                        <option value="base64">base64</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </details>
                </div>

                <div id="amily2_pf_rerank_params" style="display:none;">
                    <div class="am2-ac-field">
                        <label for="amily2_pf_top_n">返回条数</label>
                        <input id="amily2_pf_top_n" type="number" class="text_pole am2-ac-input" min="1" max="100" value="5" />
                    </div>
                    <details class="am2-ac-more amily2_advanced_section">
                        <summary>高级</summary>
                        <div class="am2-ac-more-body am2-advanced-body">
                            <label class="am2-ac-check">
                                <input id="amily2_pf_return_documents" type="checkbox" />
                                <span><strong>返回原文</strong></span>
                            </label>
                        </div>
                    </details>
                </div>
            </div>
        </div>
    </section>

    <!-- ── 分配 ── -->
    <section class="am2-ac-view" data-ac-view="routing" role="tabpanel" hidden>
        <p class="am2-ac-view-hint">为每个功能指定一套连接。未分配的功能不会调用模型。</p>
        <div id="amily2_slot_assignments" class="am2-ac-routing"></div>
    </section>

    <!-- ── 更多 ── -->
    <section class="am2-ac-view" data-ac-view="more" role="tabpanel" hidden>
        <div class="am2-ac-group">
            <h3 class="am2-ac-group-title">密钥存储</h3>
            <div class="am2-ac-settings">
                <div class="am2-ac-setting">
                    <div class="am2-ac-setting-label">
                        <strong>存储方式</strong>
                        <small id="amily2_keystore_mode_note">密钥只保存在本机浏览器</small>
                    </div>
                    <select id="amily2_keystore_mode" class="text_pole am2-ac-input am2-ac-input-sm">
                        <option value="local">本机</option>
                        <option value="cloud">加密云同步</option>
                    </select>
                </div>
            </div>

            <div id="amily2_cloud_key_section" class="am2-ac-cloud" style="display:none;">
                <div class="am2-ac-setting">
                    <div class="am2-ac-setting-label">
                        <strong>本机指纹</strong>
                        <code id="amily2_keypair_fingerprint" class="am2-ac-fp">（未生成）</code>
                    </div>
                    <button id="amily2_generate_keypair" class="am2-ac-ghost" type="button" title="重新生成会清空已加密密钥">
                        重新生成
                    </button>
                </div>
                <div class="am2-ac-inline-actions">
                    <button id="amily2_export_key_bundle" class="am2-ac-ghost" type="button">导出私钥</button>
                    <button id="amily2_import_key_bundle" class="am2-ac-ghost" type="button">导入私钥</button>
                    <input id="amily2_import_key_bundle_input" type="file" accept=".json,application/json" style="display:none;" />
                </div>
                <p class="am2-ac-warn">重新生成后，已加密的密钥全部失效，需重新输入。</p>
            </div>
        </div>

        <div class="am2-ac-group">
            <h3 class="am2-ac-group-title">维护</h3>
            <div class="am2-ac-settings">
                <div class="am2-ac-setting am2-ac-setting-stack">
                    <div class="am2-ac-setting-label">
                        <strong>清理旧版残留</strong>
                        <small>旧模块各自存的地址/密钥。分配正常后再清。</small>
                    </div>
                    <button id="amily2_clear_legacy_config" class="am2-ac-danger" type="button">清除残留</button>
                </div>
            </div>
        </div>
    </section>
</div>
