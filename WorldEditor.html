<style>
    #amily2_world_editor_panel #world-editor-container .world-editor-btn {
        max-width: 100%;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
    }
    #amily2_world_editor_panel #world-editor-container .world-editor-entries-header > div,
    #amily2_world_editor_panel #world-editor-current-book-title {
        min-width: 0;
        overflow-wrap: anywhere;
    }
    @media (max-width: 768px) {
        #amily2_world_editor_panel #world-editor-container .world-editor-entries-header > div:first-child::after {
            content: attr(data-label);
        }
        #amily2_world_editor_panel #world-editor-container .world-editor-entry-comment {
            grid-column: 2;
            width: 100%;
        }
    }
</style>
<!-- 返回按钮和标题 -->
<div class="amily2-header">
    <button id="amily2_back_to_main_from_world_editor" class="menu_button secondary small_button interactable">
        <i class="fas fa-arrow-left"></i> <span data-world-editor-i18n="worldEditorUi.back">返回</span>
    </button>
    <div class="additional-features-title" style="cursor: default;">
        <i class="fas fa-globe"></i> <span data-world-editor-i18n="worldEditorUi.title">世界编辑</span>
    </div>
</div>
<hr class="header-divider">

<!-- 主容器 -->
<div id="world-editor-container" class="world-editor">
        <div class="world-editor-header">
            <div class="world-editor-header-controls">
                <button class="world-editor-btn world-editor-btn-primary" id="world-editor-refresh-btn">
                    <i class="fas fa-sync"></i> <span data-world-editor-i18n="worldEditorUi.refresh">刷新</span>
                </button>
                <button class="world-editor-btn world-editor-btn-success" id="world-editor-create-book-btn">
                    <i class="fas fa-book-medical"></i> <span data-world-editor-i18n="worldEditorUi.createBook">新建世界</span>
                </button>
                <button class="world-editor-btn world-editor-btn-success" id="world-editor-create-entry-btn" disabled>
                    <i class="fas fa-plus"></i> <span data-world-editor-i18n="worldEditorUi.createEntry">新建条目</span>
                </button>
            </div>
        </div>

        <!-- 新的世界书选择和管理界面 -->
        <div id="world-book-selection-view">
            <div class="world-editor-toolbar">
                <div class="world-editor-toolbar-left">
                    <input type="text" class="world-editor-search-box" id="world-book-search-box" placeholder="搜索世界书..." data-world-editor-placeholder="worldEditorUi.searchBooks">
                    <button class="world-editor-btn world-editor-btn-primary" id="world-book-search-btn" aria-label="搜索" data-world-editor-aria-label="worldEditorUi.search" title="搜索" data-world-editor-title="worldEditorUi.search">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="world-editor-toolbar-right">
                    <span id="world-book-count" data-world-editor-i18n="worldEditorUi.bookCount" data-world-editor-params='{"count":0}'>世界书：0</span>
                </div>
            </div>
            <div class="world-editor-batch-actions" id="world-book-batch-actions">
                <span class="world-editor-selected-count" id="world-book-selected-count" data-world-editor-i18n="worldEditorUi.selectedCount" data-world-editor-params='{"count":0}'>已选择 0 项</span>
                <button class="world-editor-btn world-editor-btn-primary" id="world-book-clone-btn" data-world-editor-i18n="worldEditorUi.cloneBooks">备份新建</button>
                <button class="world-editor-btn world-editor-btn-danger" id="world-book-delete-btn" data-world-editor-i18n="worldEditorUi.batchDelete">批量删除</button>
            </div>
            <div id="world-book-list-container">
                <!-- 世界书列表将由JS动态生成 -->
            </div>
        </div>

        <!-- 世界书条目编辑界面 (默认隐藏) -->
        <div id="world-editor-entry-view" style="display: none;">
            <div class="world-editor-selector">
                <h3 id="world-editor-current-book-title" data-world-editor-i18n="worldEditorUi.currentBook" data-world-editor-params='{"name":""}'>当前编辑：</h3>
                <button class="world-editor-btn" id="world-editor-back-to-list-btn"><i class="fas fa-arrow-left"></i> <span data-world-editor-i18n="worldEditorUi.backToList">返回列表</span></button>
            </div>

            <div class="world-editor-toolbar">
                <div class="world-editor-toolbar-left">
                    <select id="world-editor-search-type" class="world-editor-search-box" style="width: auto; margin-right: 5px;">
                        <option value="comment" data-world-editor-i18n="worldEditorUi.searchComment">搜索条目</option>
                        <option value="content" data-world-editor-i18n="worldEditorUi.searchContent">搜索内容</option>
                    </select>
                    <input type="text" class="world-editor-search-box" id="world-editor-search-box" placeholder="输入关键词..." data-world-editor-placeholder="worldEditorUi.searchPlaceholder">
                    <button class="world-editor-btn world-editor-btn-primary" id="world-editor-search-btn" aria-label="搜索" data-world-editor-aria-label="worldEditorUi.search" title="搜索" data-world-editor-title="worldEditorUi.search">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <div class="world-editor-toolbar-right">
                    <span id="world-editor-entry-count" data-world-editor-i18n="worldEditorUi.entryCount" data-world-editor-params='{"count":0}'>条目：0</span>
                </div>
            </div>

            <div class="world-editor-entries-wrapper">
                <div class="world-editor-batch-actions" id="world-editor-batch-actions">
                    <span class="world-editor-selected-count" id="world-editor-selected-count" data-world-editor-i18n="worldEditorUi.selectedCount" data-world-editor-params='{"count":0}'>已选择 0 项</span>
                    <button class="world-editor-btn world-editor-btn-primary" id="world-editor-enable-selected-btn" data-world-editor-i18n="worldEditorUi.batchEnable">批量启用</button>
                    <button class="world-editor-btn world-editor-btn-warning" id="world-editor-disable-selected-btn" data-world-editor-i18n="worldEditorUi.batchDisable">批量禁用</button>
                    <button class="world-editor-btn world-editor-btn-primary" id="world-editor-set-blue-btn" data-world-editor-i18n="worldEditorUi.batchConstant">批量蓝灯</button>
                    <button class="world-editor-btn world-editor-btn-success" id="world-editor-set-green-btn" data-world-editor-i18n="worldEditorUi.batchSelective">批量绿灯</button>
                    <button class="world-editor-btn world-editor-btn-info" id="world-editor-copy-entries-btn" data-world-editor-i18n="worldEditorUi.copyEntries">复制条目</button>
                    <button class="world-editor-btn world-editor-btn-danger" id="world-editor-delete-selected-btn" data-world-editor-i18n="worldEditorUi.batchDelete">批量删除</button>
                    <button class="world-editor-btn world-editor-btn-primary" id="world-editor-set-disable-recursion-btn" data-world-editor-i18n="worldEditorUi.excludeRecursion">不可递归</button>
                    <button class="world-editor-btn world-editor-btn-primary" id="world-editor-set-prevent-recursion-btn" data-world-editor-i18n="worldEditorUi.preventRecursion">防止递归</button>
                </div>
                
                <div id="world-editor-entries-container">
                    <div class="world-editor-entries-header">
                        <div data-label="全选" data-world-editor-data-label="worldEditorUi.selectAllLabel"><input type="checkbox" id="world-editor-select-all" aria-label="全选条目" data-world-editor-aria-label="worldEditorUi.selectAll"></div>
                        <div data-sort="enabled" data-world-editor-i18n="worldEditorUi.column.enabled">状态</div>
                        <div data-sort="type" data-world-editor-i18n="worldEditorUi.column.type">灯色</div>
                        <div data-sort="comment" data-world-editor-i18n="worldEditorUi.column.comment">条目</div>
                        <div data-sort="content" data-world-editor-i18n="worldEditorUi.column.content">内容</div>
                        <div data-sort="position" data-world-editor-i18n="worldEditorUi.column.position">位置</div>
                        <div data-sort="depth" data-world-editor-i18n="worldEditorUi.column.depth">深度</div>
                        <div data-sort="order" data-world-editor-i18n="worldEditorUi.column.order">顺序</div>
                    </div>
                    <div class="world-editor-loading">
                        <i class="fas fa-spinner fa-spin"></i> <span data-world-editor-i18n="worldEditorUi.loading">加载中...</span>
        </div>
    </div>
        </div>
    </div>
</div>
